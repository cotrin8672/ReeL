name: Build ZMK firmware

on:
  push:
    paths:
      - ".github/workflows/build-zmk.yml"
      - "boards/**"
      - "config/**"
      - "zephyr/**"
      - "build.yaml"
  pull_request:
    paths:
      - ".github/workflows/build-zmk.yml"
      - "boards/**"
      - "config/**"
      - "zephyr/**"
      - "build.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@904c9aec8822d79149d42c8a9a77e8828eb08f5a
    with:
      archive_name: reel-firmware
